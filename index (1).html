<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APB Protocol Visualizer</title>
<style>
:root{
  --bg:#0a0e14; --panel:#111722; --panel2:#0d1219; --border:#1e2733;
  --text:#e6edf3; --sub:#7d8b9c;
  --pclk:#22c55e; --presetn:#ef4444; --psel:#22d3ee; --penable:#f97316;
  --pwrite:#a855f7; --paddr:#eab308; --pwdata:#ec4899; --prdata:#65a30d;
  --pready:#3b82f6; --pslverr:#f97316;
  --accent:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif;
  padding:16px; font-size:14px;
}
header{
  display:flex; align-items:center; gap:16px; background:var(--panel);
  border:1px solid var(--border); border-radius:10px; padding:10px 16px; margin-bottom:14px;
  flex-wrap:wrap;
}
.logo{
  width:40px;height:40px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#7c3aed);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
}
.title h1{font-size:17px;letter-spacing:.5px;}
.title p{font-size:11px;color:var(--sub);}
.btn{
  border:none;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;
  color:#fff;cursor:pointer;display:flex;align-items:center;gap:6px;transition:filter .15s;
}
.btn:hover{filter:brightness(1.15);}
.btn:active{transform:translateY(1px);}
.btn-run{background:#16a34a;} .btn-pause{background:#2563eb;}
.btn-step{background:#7c3aed;} .btn-reset{background:#dc2626;}
.speed-wrap{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:13px;}
select{
  background:var(--panel2);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:6px 8px;font-size:13px;
}
.tabs{margin-left:auto;display:flex;gap:2px;background:var(--panel2);border-radius:8px;padding:3px;}
.tab{
  padding:8px 14px;border-radius:6px;font-size:12px;font-weight:600;letter-spacing:.3px;
  cursor:pointer;color:var(--sub); border:none; background:transparent;
}
.tab.active{background:var(--accent);color:#fff;}

.layout{display:grid;grid-template-columns:300px 1fr;gap:14px;}
.col-left{display:flex;flex-direction:column;gap:14px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;}
.panel h2{font-size:12px;letter-spacing:1px;color:var(--sub);margin-bottom:12px;}

label{display:block;font-size:12px;color:var(--sub);margin:10px 0 5px;}
label:first-of-type{margin-top:0;}
select.full,input.full{
  width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
  border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;
}
input.full{font-family:'Consolas',monospace;}
.radio-row{display:flex;gap:16px;margin-top:4px;}
.radio-row label{display:flex;align-items:center;gap:6px;margin:0;color:var(--text);font-size:13px;cursor:pointer;}
.start-btn{
  width:100%;margin-top:14px;background:var(--accent);color:#fff;border:none;border-radius:7px;
  padding:11px;font-weight:700;font-size:13px;letter-spacing:.5px;cursor:pointer;
}
.start-btn:hover{filter:brightness(1.1);}
.start-btn:disabled{opacity:.5;cursor:not-allowed;}

.sig-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.sig-name{flex:1;font-size:12px;color:var(--sub);}
.sig-val{
  min-width:100px;text-align:right;background:var(--panel2);border:1px solid var(--border);
  border-radius:5px;padding:4px 8px;font-family:'Consolas',monospace;font-size:12px;
}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin-bottom:6px;}

.diagram-wrap{overflow-x:auto;}
svg{display:block;}
.wave-wrap{overflow-x:auto;margin-top:8px;}

.status-bar{
  display:flex;align-items:center;gap:24px;background:var(--panel);border:1px solid var(--border);
  border-radius:10px;padding:10px 16px;margin-top:14px;font-size:12px;color:var(--sub);
}
.status-dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px #22c55e;}
.status-bar b{color:var(--text);}
@media(max-width:900px){.layout{grid-template-columns:1fr;}}
</style>
</head>
<body>

<header>
  <div class="logo">🔲</div>
  <div class="title"><h1>APB PROTOCOL VISUALIZER</h1><p>Interactive APB Bus Simulator</p></div>
  <button class="btn btn-run" id="runBtn">▶ Run</button>
  <button class="btn btn-pause" id="pauseBtn">⏸ Pause</button>
  <button class="btn btn-step" id="stepBtn">⏭ Step</button>
  <button class="btn btn-reset" id="resetBtn">↺ Reset</button>
  <div class="speed-wrap">Speed:
    <select id="speedSel"><option>0.5x</option><option selected>1x</option><option>2x</option><option>4x</option></select>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="bus">BUS VIEW</button>
    <button class="tab" data-tab="wave">WAVEFORM</button>
    <button class="tab" data-tab="reg">REGISTER VIEW</button>
    <button class="tab" data-tab="about">ABOUT</button>
  </div>
</header>

<div class="layout">
  <div class="col-left">
    <div class="panel">
      <h2>TRANSACTION CONTROL</h2>
      <label>Select Slave</label>
      <select class="full" id="slaveSel">
        <option value="0">SLAVE 1 (0x0000_0000)</option>
        <option value="1">SLAVE 2 (0x0000_1000)</option>
        <option value="2">SLAVE 3 (0x0000_2000)</option>
      </select>
      <label>Operation</label>
      <div class="radio-row">
        <label><input type="radio" name="op" value="read"> READ</label>
        <label><input type="radio" name="op" value="write" checked> WRITE</label>
      </div>
      <label>Address (32-bit)</label>
      <input class="full" id="addrIn" value="0x0000_0004">
      <label>Write Data (32-bit)</label>
      <input class="full" id="dataIn" value="0xA5A5_5A5A">
      <button class="start-btn" id="startBtn">START TRANSACTION</button>
    </div>

    <div class="panel">
      <h2>APB SIGNALS</h2>
      <div id="sigList"></div>
    </div>

    <div class="panel">
      <h2>LEGEND</h2>
      <div class="legend-item"><span class="dot" style="background:#22d3ee"></span>Master Driven</div>
      <div class="legend-item"><span class="dot" style="background:#65a30d"></span>Slave Driven</div>
      <div class="legend-item"><span class="dot" style="background:#eab308"></span>System Signal</div>
    </div>
  </div>

  <div class="col-right">
    <div class="panel">
      <h2>APB BUS ARCHITECTURE</h2>
      <div class="diagram-wrap" id="diagramWrap"></div>
    </div>
    <div class="panel" style="margin-top:14px;">
      <h2>REAL-TIME WAVEFORM</h2>
      <div class="wave-wrap" id="waveWrap"></div>
    </div>
  </div>
</div>

<div class="status-bar">
  <div style="display:flex;align-items:center;gap:8px;"><span class="status-dot" id="statusDot"></span>STATUS: <b id="statusTxt">IDLE</b></div>
  <div>Last Transaction: <b id="lastTxn">—</b></div>
  <div style="margin-left:auto;">Cycle: <b id="cycleTxt">0</b></div>
</div>

<script>
const SIGNALS = [
  {key:'pclk',    name:'PCLK',        color:'var(--pclk)',    kind:'sys'},
  {key:'presetn', name:'PRESETn',     color:'var(--presetn)', kind:'sys'},
  {key:'psel',    name:'PSEL',        color:'var(--psel)',    kind:'m'},
  {key:'penable', name:'PENABLE',     color:'var(--penable)', kind:'m'},
  {key:'pwrite',  name:'PWRITE',      color:'var(--pwrite)',  kind:'m'},
  {key:'paddr',   name:'PADDR[31:0]', color:'var(--paddr)',   kind:'m', bus:true},
  {key:'pwdata',  name:'PWDATA[31:0]',color:'var(--pwdata)',  kind:'m', bus:true},
  {key:'prdata',  name:'PRDATA[31:0]',color:'var(--prdata)',  kind:'s', bus:true},
  {key:'pready',  name:'PREADY',      color:'var(--pready)',  kind:'s'},
  {key:'pslverr', name:'PSLVERR',     color:'var(--pslverr)', kind:'s'},
];

let state = {
  pclk:1, presetn:1, psel:0, penable:0, pwrite:1,
  paddr:'0x0000_0004', pwdata:'0xA5A5_5A5A', prdata:'0x0000_0000',
  pready:0, pslverr:0, cycle:0, running:false, phase:'IDLE'
};
let history = []; // array of state snapshots per half-cycle for waveform
let timer = null;
let pendingTxn = null;

function resolveColor(v){
  const d=document.createElement('div'); d.style.color=v; document.body.appendChild(d);
  const c=getComputedStyle(d).color; document.body.removeChild(d); return c;
}

function renderSignalList(){
  const list = document.getElementById('sigList');
  list.innerHTML = SIGNALS.map(s=>`
    <div class="sig-row">
      <span class="dot" style="background:${resolveColor(s.color)}"></span>
      <span class="sig-name">${s.name}</span>
      <span class="sig-val" id="val_${s.key}">${state[s.key]}</span>
    </div>`).join('');
}
function updateSignalVals(){
  SIGNALS.forEach(s=>{ const el=document.getElementById('val_'+s.key); if(el) el.textContent = state[s.key]; });
}

function renderDiagram(){
  const active = state.psel;
  const activeSlave = pendingTxn ? pendingTxn.slave : 0;
  const slaves = [0,1,2];
  const colors = {pclk:resolveColor('var(--pclk)'),presetn:resolveColor('var(--presetn)'),psel:resolveColor('var(--psel)'),
    penable:resolveColor('var(--penable)'),pwrite:resolveColor('var(--pwrite)'),paddr:resolveColor('var(--paddr)'),
    pwdata:resolveColor('var(--pwdata)'),prdata:resolveColor('var(--prdata)'),pready:resolveColor('var(--pready)'),pslverr:resolveColor('var(--pslverr)')};
  const busLines = ['pclk','presetn','psel','penable','pwrite','paddr','pwdata','prdata','pready','pslverr'];
  const W=1000,H=440;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:1100px">`;

  // I/O pads left
  const padLabels = ['PCLK','PRESETn','PSEL','PENABLE','PWRITE','PADDR[31:0]','PWDATA[31:0]','PRDATA[31:0]','PREADY','PSLVERR'];
  svg += `<rect x="10" y="20" width="120" height="380" rx="8" fill="none" stroke="#2a3542"/>`;
  svg += `<text x="70" y="14" fill="#7d8b9c" font-size="10" text-anchor="middle">I/O PADS</text>`;
  padLabels.forEach((l,i)=>{
    const y=45+i*35;
    svg += `<rect x="22" y="${y-12}" width="96" height="24" rx="5" fill="#0d1219" stroke="#2a3542"/>`;
    svg += `<text x="70" y="${y+4}" fill="#c5ccd4" font-size="9" text-anchor="middle">${l}</text>`;
  });

  // master box
  svg += `<rect x="180" y="60" width="150" height="300" rx="8" fill="#173157" stroke="#2563eb"/>`;
  svg += `<text x="255" y="200" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="middle">APB MASTER</text>`;
  svg += `<text x="255" y="218" fill="#93b4e0" font-size="10" text-anchor="middle">(CPU / DMA)</text>`;

  // pad -> master arrows
  padLabels.forEach((l,i)=>{
    const y=45+i*35;
    const isOut = i>=6; // prdata,pready... wait prdata index7,pready8,pslverr9 are slave->master direction visually reversed; simplistic left arrows for outputs
    svg += `<line x1="118" y1="${y}" x2="178" y2="${y}" stroke="#3a4552" stroke-width="1.5" marker-end="url(#arrow)"/>`;
  });

  // bus label
  svg += `<text x="620" y="50" fill="#7d8b9c" font-size="10" text-anchor="middle">APB BUS</text>`;

  // horizontal bus lines from master to slaves
  const busY0=90, busGap=27;
  busLines.forEach((k,i)=>{
    const y = busY0 + i*busGap;
    svg += `<line x1="330" y1="${y}" x2="900" y2="${y}" stroke="${colors[k]}" stroke-width="2" opacity="${state.psel?1:0.35}"/>`;
    // arrowheads toward slaves for master-driven, toward master for slave-driven
    const towardSlave = ['pclk','presetn','psel','penable','pwrite','paddr','pwdata'].includes(k);
    if(towardSlave){
      svg += `<polygon points="895,${y-4} 905,${y} 895,${y+4}" fill="${colors[k]}" opacity="${state.psel?1:0.35}"/>`;
    } else {
      svg += `<polygon points="335,${y-4} 325,${y} 335,${y+4}" fill="${colors[k]}" opacity="${state.psel?1:0.35}"/>`;
    }
  });

  // slave boxes
  const slaveNames=['SLAVE 1','SLAVE 2','SLAVE 3'];
  const slaveAddrs=['0x0000_0000','0x0000_1000','0x0000_2000'];
  const slaveColors=['#14532d','#4d3b00','#3b1f5c'];
  const slaveBorders=['#22c55e','#eab308','#a855f7'];
  slaves.forEach((s,i)=>{
    const y = 60 + i*105;
    const sel = state.psel && activeSlave===i;
    svg += `<rect x="905" y="${y}" width="140" height="90" rx="8" fill="${slaveColors[i]}" stroke="${sel?'#fff':slaveBorders[i]}" stroke-width="${sel?2.5:1.5}"/>`;
    svg += `<text x="975" y="${y+32}" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">${slaveNames[i]}</text>`;
    svg += `<text x="975" y="${y+48}" fill="#cbd5e1" font-size="9" text-anchor="middle">(${slaveAddrs[i]})</text>`;
    svg += `<text x="975" y="${y+66}" fill="#cbd5e1" font-size="9" text-anchor="middle">32-bit Registers</text>`;
  });

  svg += `<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3a4552"/></marker></defs>`;

  // legend row
  const legend = SIGNALS;
  let lx=10, ly=420;
  svg += legend.map(s=>{
    const c = resolveColor(s.color);
    const box = `<circle cx="${lx+5}" cy="${ly}" r="4" fill="${c}"/><text x="${lx+14}" y="${ly+3}" font-size="9" fill="#9aa7b5">${s.name}</text>`;
    lx += 14 + s.name.length*5.6 + 16;
    return box;
  }).join('');

  svg += `</svg>`;
  document.getElementById('diagramWrap').innerHTML = svg;
}

function renderWaveform(){
  const rowH = 32, labelW = 130, cellW = 34, headerH=24;
  const n = 20; // visible cycles window (half-cycle steps -> show last N clock edges)
  const visible = history.slice(-n*2);
  const W = labelW + Math.max(visible.length,1)*cellW + 10;
  const H = headerH + SIGNALS.length*rowH + 10;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;

  // time header
  for(let i=0;i<visible.length;i+=2){
    const x = labelW + i*cellW + cellW;
    svg += `<text x="${x}" y="16" fill="#5b6672" font-size="10" text-anchor="middle">${Math.floor(i/2)}</text>`;
  }

  SIGNALS.forEach((s,row)=>{
    const y = headerH + row*rowH;
    const color = resolveColor(s.color);
    svg += `<text x="4" y="${y+rowH/2+4}" fill="${color}" font-size="11" font-weight="600">${s.name}</text>`;
    if(visible.length===0) return;

    if(s.bus){
      // draw bus value blocks: group consecutive equal values
      let x0=0, curVal=visible[0][s.key];
      for(let i=1;i<=visible.length;i++){
        const v = i<visible.length ? visible[i][s.key] : null;
        if(v!==curVal || i===visible.length){
          const x1=i;
          const px0 = labelW + x0*cellW, px1 = labelW + x1*cellW;
          const midY = y+rowH/2;
          svg += `<path d="M${px0+4},${midY-9} L${px1-4},${midY-9} L${px1+2},${midY} L${px1-4},${midY+9} L${px0+4},${midY+9} L${px0-2},${midY} Z" fill="none" stroke="${color}" stroke-width="1.5"/>`;
          if(px1-px0>36) svg += `<text x="${(px0+px1)/2}" y="${midY+4}" fill="${color}" font-size="9" text-anchor="middle" font-family="Consolas,monospace">${curVal}</text>`;
          x0=i; curVal=v;
        }
      }
    } else {
      let d='';
      visible.forEach((snap,i)=>{
        const v = snap[s.key];
        const x = labelW + i*cellW;
        const yHigh = y+8, yLow = y+rowH-8;
        const yy = v ? yHigh : yLow;
        d += (i===0? `M${x},${yy}`: ` L${x},${yy}`);
        d += ` L${x+cellW},${yy}`;
      });
      svg += `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.6"/>`;
    }
    svg += `<line x1="0" y1="${y+rowH}" x2="${W}" y2="${y+rowH}" stroke="#1a222c" stroke-width="1"/>`;
  });

  svg += `</svg>`;
  document.getElementById('waveWrap').innerHTML = svg;
}

function snapshot(){
  history.push({...state});
  if(history.length>200) history.shift();
}

function setStatus(txt, color){
  document.getElementById('statusTxt').textContent = txt;
  document.getElementById('statusDot').style.background = color;
  document.getElementById('statusDot').style.boxShadow = `0 0 6px ${color}`;
}

function renderAll(){
  updateSignalVals();
  renderDiagram();
  renderWaveform();
  document.getElementById('cycleTxt').textContent = state.cycle;
}

// APB FSM: IDLE -> SETUP -> ACCESS -> IDLE, driven per half-clock-edge
function tick(){
  state.pclk = state.pclk ? 0 : 1;
  state.cycle++;

  if(state.pclk === 1){ // act on rising edge
    if(state.phase==='SETUP'){
      state.penable = 1;
      state.phase='ACCESS';
    } else if(state.phase==='ACCESS'){
      state.pready = 1;
      if(!pendingTxn.write){ state.prdata = '0x' + Math.floor(Math.random()*0xffffffff).toString(16).toUpperCase().padStart(8,'0').replace(/(.{4})(.{4})/,'$1_$2'); }
      setStatus('DONE','#22c55e');
      document.getElementById('lastTxn').textContent =
        `${pendingTxn.write?'WRITE to':'READ from'} ${state.paddr}${pendingTxn.write? ' = '+state.pwdata:''}`;
      state.phase='DONE';
    } else if(state.phase==='DONE'){
      state.psel=0; state.penable=0; state.pready=0;
      state.phase='IDLE';
      setStatus('IDLE','#7d8b9c');
      stopRun();
    } else if(pendingTxn && state.phase==='IDLE'){
      state.psel=1; state.penable=0; state.pready=0;
      state.paddr = pendingTxn.addr; state.pwrite = pendingTxn.write?1:0;
      if(pendingTxn.write) state.pwdata = pendingTxn.data;
      state.phase='SETUP';
      setStatus('RUNNING','#eab308');
    }
  }
  snapshot();
  renderAll();
}

function stopRun(){
  state.running=false;
  clearInterval(timer); timer=null;
}

function startRun(){
  if(!pendingTxn) return;
  if(state.running) return;
  state.running=true;
  const speed = document.getElementById('speedSel').value;
  const mult = {'0.5x':2,'1x':1,'2x':0.5,'4x':0.25}[speed];
  timer = setInterval(tick, 400*mult);
}

document.getElementById('startBtn').addEventListener('click', ()=>{
  const slave = document.getElementById('slaveSel').value;
  const op = document.querySelector('input[name=op]:checked').value;
  const addr = document.getElementById('addrIn').value || '0x0000_0000';
  const data = document.getElementById('dataIn').value || '0x0000_0000';
  pendingTxn = { slave: parseInt(slave), write: op==='write', addr, data };
  state.phase='IDLE'; state.psel=0; state.penable=0; state.pready=0;
  setStatus('READY','#3b82f6');
  startRun();
});

document.getElementById('runBtn').addEventListener('click', startRun);
document.getElementById('pauseBtn').addEventListener('click', stopRun);
document.getElementById('stepBtn').addEventListener('click', ()=>{ if(!state.running) tick(); });
document.getElementById('resetBtn').addEventListener('click', ()=>{
  stopRun();
  state = {pclk:1,presetn:1,psel:0,penable:0,pwrite:1,paddr:'0x0000_0004',pwdata:'0xA5A5_5A5A',
    prdata:'0x0000_0000',pready:0,pslverr:0,cycle:0,running:false,phase:'IDLE'};
  history=[]; pendingTxn=null;
  document.getElementById('lastTxn').textContent='—';
  setStatus('IDLE','#7d8b9c');
  renderAll();
});
document.getElementById('speedSel').addEventListener('change', ()=>{
  if(state.running){ stopRun(); state.running=true; const speed=document.getElementById('speedSel').value;
    const mult={'0.5x':2,'1x':1,'2x':0.5,'4x':0.25}[speed]; timer=setInterval(tick,400*mult); }
});

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
}));

renderSignalList();
snapshot();
renderAll();
</script>
</body>
</html>
